<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELORA | Admin Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #F8F7F4;
            color: #171717;
            font-family: 'Inter', sans-serif;
        }

        header {
            background: #171717;
            color: white;
            padding: 22px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            letter-spacing: 4px;
        }

        .admin-label {
            color: #B49A7A;
            font-size: 11px;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .header-right {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .header-right a {
            color: white;
            text-decoration: none;
            font-size: 13px;
        }

        .logout-btn {
            background: #B49A7A;
            color: white;
            border: none;
            padding: 11px 20px;
            cursor: pointer;
        }

        .container {
            max-width: 1250px;
            margin: 55px auto;
            padding: 0 25px;
        }

        .page-heading {
            margin-bottom: 35px;
        }

        .page-heading h1 {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            font-weight: 500;
        }

        .page-heading p {
            color: #777;
            margin-top: 10px;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 27px;
            border: 1px solid #EDE8E0;
        }

        .stat-card p {
            color: #777;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .stat-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            font-weight: 500;
        }

        .orders-section {
            background: white;
            border: 1px solid #EDE8E0;
            padding: 30px;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .section-heading h2 {
            font-family: 'Playfair Display', serif;
            font-size: 25px;
            font-weight: 500;
        }

        .refresh-btn {
            background: #171717;
            color: white;
            border: none;
            padding: 11px 18px;
            cursor: pointer;
        }

        .order-card {
            border: 1px solid #EDE8E0;
            padding: 23px;
            margin-bottom: 20px;
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid #EDE8E0;
            padding-bottom: 17px;
        }

        .order-number {
            font-weight: 600;
            font-size: 14px;
        }

        .order-date {
            color: #777;
            font-size: 12px;
            margin-top: 7px;
        }

        .order-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            padding: 22px 0;
        }

        .detail-label {
            color: #777;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 13px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .order-items {
            background: #F8F7F4;
            padding: 15px;
            margin-bottom: 20px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            font-size: 13px;
            padding: 7px 0;
        }

        .order-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-top: 1px solid #EDE8E0;
            padding-top: 20px;
        }

        .total {
            font-size: 19px;
            font-weight: 600;
        }

        .status-control {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        select {
            padding: 11px;
            border: 1px solid #EDE8E0;
            background: white;
            font-family: inherit;
        }

        .update-btn {
            background: #171717;
            color: white;
            border: none;
            padding: 11px 17px;
            cursor: pointer;
        }

        .update-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            background: #EDE8E0;
            color: #806747;
            padding: 8px 12px;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #message {
            text-align: center;
            color: #777;
            padding: 25px;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 40px;
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid #EDE8E0;
            color: #777;
            font-size: 12px;
            margin-top: 70px;
        }

        @media(max-width: 850px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 550px) {
            header {
                padding: 20px;
            }

            .header-right {
                gap: 10px;
            }

            .header-right a {
                display: none;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat-card {
                padding: 17px;
            }

            .stat-card h2 {
                font-size: 23px;
            }

            .orders-section {
                padding: 15px;
            }

            .order-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div>
        <div class="logo">VELORA</div>
        <div class="admin-label">ADMINISTRATION PANEL</div>
    </div>

    <div class="header-right">
    <a href="index.html">VIEW STORE</a>
    <a href="admin-products.html">PRODUCT MANAGER</a>
    <button class="logout-btn" id="logoutBtn">LOGOUT</button>
</div>
</header>

<main class="container">

    <section class="page-heading">
        <h1>Dashboard Overview</h1>
        <p>Manage your VELORA store and customer orders.</p>
    </section>

    <section class="stats">

        <div class="stat-card">
            <p>Total Orders</p>
            <h2 id="totalOrders">0</h2>
        </div>

        <div class="stat-card">
            <p>Total Sales</p>
            <h2 id="totalSales">₹0</h2>
        </div>

        <div class="stat-card">
            <p>Pending Orders</p>
            <h2 id="pendingOrders">0</h2>
        </div>

        <div class="stat-card">
            <p>Delivered Orders</p>
            <h2 id="deliveredOrders">0</h2>
        </div>

    </section>

    <section class="orders-section">

        <div class="section-heading">
            <h2>Customer Orders</h2>
            <button class="refresh-btn" id="refreshBtn">
                REFRESH
            </button>
        </div>

        <div id="message">Checking administrator access...</div>

        <div id="ordersContainer"></div>

    </section>

</main>

<footer>
    © 2026 VELORA. Admin Dashboard.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>

<script>

const ordersContainer = document.getElementById("ordersContainer");
const message = document.getElementById("message");

const statuses = [
    "Pending",
    "Confirmed",
    "Processing",
    "Shipped",
    "Delivered",
    "Cancelled"
];

function formatMoney(amount) {
    return "₹" + Number(amount || 0).toLocaleString("en-IN");
}

function addText(parent, tag, className, value) {
    const element = document.createElement(tag);
    element.className = className;
    element.textContent = value;
    parent.appendChild(element);
    return element;
}

async function checkAdmin() {

    try {

        const { data: { user }, error: authError } =
            await supabaseClient.auth.getUser();

        if (authError || !user) {
            window.location.href = "login.html";
            return false;
        }

        const { data: isAdmin, error } =
            await supabaseClient.rpc("is_admin");

        if (error) {
            throw error;
        }

        if (isAdmin !== true) {
            alert("Access denied. Administrator privileges required.");
            window.location.href = "account.html";
            return false;
        }

        return true;

    } catch (error) {

        console.error("Admin verification error:", error);
        message.textContent = "Unable to verify administrator access.";
        return false;

    }

}

async function loadOrders() {

    message.textContent = "Loading customer orders...";
    ordersContainer.innerHTML = "";

    const { data: orders, error } = await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        throw error;
    }

    // Dashboard statistics
    const totalSales = orders.reduce(
        (sum, order) => sum + Number(order.total),
        0
    );

    document.getElementById("totalOrders").textContent = orders.length;

    document.getElementById("totalSales").textContent =
        formatMoney(totalSales);

    document.getElementById("pendingOrders").textContent =
        orders.filter(order => order.status === "Pending").length;

    document.getElementById("deliveredOrders").textContent =
        orders.filter(order => order.status === "Delivered").length;

    message.style.display = "none";

    if (orders.length === 0) {

        message.style.display = "block";
        message.textContent = "No customer orders found.";
        return;

    }

    orders.forEach(order => {

        const card = document.createElement("article");
        card.className = "order-card";

        // Order heading
        const top = document.createElement("div");
        top.className = "order-top";

        const orderInfo = document.createElement("div");

        addText(
            orderInfo,
            "p",
            "order-number",
            "Order #" + order.order_number
        );

        addText(
            orderInfo,
            "p",
            "order-date",
            new Date(order.created_at).toLocaleString("en-IN")
        );

        addText(top, "span", "status", order.status);

        top.insertBefore(orderInfo, top.firstChild);
        card.appendChild(top);

        // Customer information
        const details = document.createElement("div");
        details.className = "order-details";

        const customer = document.createElement("div");

        addText(customer, "p", "detail-label", "Customer Details");

        const customerData = order.customer_details || {};

        addText(customer, "p", "detail-value",
            "Name: " + (customerData.name || "Not provided"));

        addText(customer, "p", "detail-value",
            "Email: " + (customerData.email || "Not provided"));

        addText(customer, "p", "detail-value",
            "Phone: " + (customerData.phone || "Not provided"));

        const address = document.createElement("div");

        addText(address, "p", "detail-label", "Delivery Address");

        addText(address, "p", "detail-value",
            [
                customerData.address,
                customerData.city,
                customerData.state,
                customerData.pincode
            ].filter(Boolean).join(", ") || "Not provided");

        addText(address, "p", "detail-value",
            "Payment: " + (order.payment_method || "Not specified"));

        details.append(customer, address);
        card.appendChild(details);

        // Purchased products
        const itemsBox = document.createElement("div");
        itemsBox.className = "order-items";

        (Array.isArray(order.items) ? order.items : []).forEach(item => {

            const row = document.createElement("div");
            row.className = "order-item";

            addText(
                row,
                "span",
                "",
                item.name + " | Size: " + (item.size || "Standard") +
                " | Qty: " + item.quantity
            );

            addText(
                row,
                "strong",
                "",
                formatMoney(Number(item.price) * Number(item.quantity))
            );

            itemsBox.appendChild(row);

        });

        card.appendChild(itemsBox);

        // Order total and status controls
        const bottom = document.createElement("div");
        bottom.className = "order-bottom";

        addText(
            bottom,
            "p",
            "total",
            "Total: " + formatMoney(order.total)
        );

        const controls = document.createElement("div");
        controls.className = "status-control";

        const select = document.createElement("select");

        statuses.forEach(statusValue => {

            const option = document.createElement("option");
            option.value = statusValue;
            option.textContent = statusValue;

            if (statusValue === order.status) {
                option.selected = true;
            }

            select.appendChild(option);

        });

        const updateButton = document.createElement("button");
        updateButton.className = "update-btn";
        updateButton.textContent = "UPDATE STATUS";

        updateButton.addEventListener("click", async () => {

            updateButton.disabled = true;
            updateButton.textContent = "UPDATING...";

            try {

                const { error } = await supabaseClient
                    .from("orders")
                    .update({ status: select.value })
                    .eq("id", order.id);

                if (error) {
                    throw error;
                }

                alert("Order status updated successfully!");

                await loadOrders();

            } catch (error) {

                alert("Unable to update order: " + error.message);

            } finally {

                updateButton.disabled = false;
                updateButton.textContent = "UPDATE STATUS";

            }

        });

        controls.append(select, updateButton);
        bottom.appendChild(controls);
        card.appendChild(bottom);

        ordersContainer.appendChild(card);

    });

}

async function initializeDashboard() {

    const allowed = await checkAdmin();

    if (!allowed) return;

    try {
        await loadOrders();
    } catch (error) {
        console.error("Dashboard error:", error);
        message.style.display = "block";
        message.textContent = "Unable to load orders: " + error.message;
    }

}

document.getElementById("refreshBtn").addEventListener(
    "click",
    async () => {
        try {
            await loadOrders();
        } catch (error) {
            alert(error.message);
        }
    }
);

document.getElementById("logoutBtn").addEventListener(
    "click",
    async () => {

        const { error } = await supabaseClient.auth.signOut();

        if (error) {
            alert(error.message);
            return;
        }

        window.location.href = "login.html";

    }
);

initializeDashboard();

</script>

</body>
</html>
