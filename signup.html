
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | VELORA</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #F8F7F4;
            color: #171717;
            font-family: 'Inter', sans-serif;
        }

        .signup-wrapper {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .signup-box {
            width: 100%;
            max-width: 460px;
            background: #fff;
            padding: 45px;
            box-sizing: border-box;
            border: 1px solid #e8e3dc;
        }

        .signup-logo {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        .signup-subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        .signup-box h1 {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .signup-description {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .signup-box label {
            display: block;
            font-size: 13px;
            margin: 18px 0 8px;
        }

        .signup-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid #ddd6cd;
            background: #F8F7F4;
            font-size: 14px;
            outline: none;
        }

        .signup-box input:focus {
            border-color: #B49A7A;
        }

        .signup-button {
            width: 100%;
            padding: 16px;
            margin-top: 25px;
            background: #171717;
            color: white;
            border: none;
            letter-spacing: 2px;
            cursor: pointer;
            font-size: 13px;
        }

        .signup-button:hover {
            background: #B49A7A;
        }

        .signup-message {
            display: none;
            padding: 12px;
            margin-top: 18px;
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
        }

        .signup-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #777;
        }

        .signup-footer a {
            color: #171717;
            font-weight: 600;
            text-decoration: none;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #777;
            text-decoration: none;
            font-size: 12px;
        }

        @media(max-width: 500px) {
            .signup-box {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-wrapper">

        <div class="signup-box">

            <div class="signup-logo">VELORA.</div>

            <div class="signup-subtitle">
                Define Your Style. Own Your Identity.
            </div>

            <h1>Create Account</h1>

            <p class="signup-description">
                Join VELORA and discover timeless fashion.
            </p>

            <form id="signup-form">

                <label for="full-name">Full Name</label>
                <input
                    type="text"
                    id="full-name"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >

                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm your password"
                    minlength="8"
                    required
                >

                <button type="submit" class="signup-button" id="signup-button">
                    CREATE ACCOUNT
                </button>

                <div id="signup-message" class="signup-message"></div>

            </form>

            <div class="signup-footer">
                Already have an account?
                <a href="login.html">Sign In</a>
            </div>

            <a href="index.html" class="back-home">
                ← BACK TO HOME
            </a>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>

    <script>
        const signupForm = document.getElementById("signup-form");
        const signupMessage = document.getElementById("signup-message");
        const signupButton = document.getElementById("signup-button");

        function showMessage(message, success) {
            signupMessage.style.display = "block";
            signupMessage.textContent = message;
            signupMessage.style.background = success ? "#e7f4e8" : "#fbe9e7";
            signupMessage.style.color = success ? "#236b32" : "#a12b20";
        }

        signupForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const fullName = document.getElementById("full-name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;

            if (password !== confirmPassword) {
                showMessage("Passwords do not match.", false);
                return;
            }

            if (password.length < 8) {
                showMessage("Password must contain at least 8 characters.", false);
                return;
            }

            signupButton.disabled = true;
            signupButton.textContent = "CREATING ACCOUNT...";

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName
                        },
                        emailRedirectTo: window.location.origin + "/login.html"
                    }
                });

                if (error) throw error;

                if (data.user && data.session) {
                    showMessage("Your account has been created successfully!", true);
                } else {
                    showMessage(
                        "Registration successful! Please check your email and click the verification link before signing in.",
                        true
                    );
                }

                signupForm.reset();

            } catch (error) {
                showMessage(error.message || "Something went wrong. Please try again.", false);
            } finally {
                signupButton.disabled = false;
                signupButton.textContent = "CREATE ACCOUNT";
            }
        });
    </script>

</body>
</html>
